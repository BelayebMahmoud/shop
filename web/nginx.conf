# Serves the React build and proxies /api to the API container (same origin: no CORS).
# Security headers (fiche 4, TP3 D01/D02): CSP, frame-ancestors, nosniff, referrer policy, no server version.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header server;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;  # client-side routes
    }
}
