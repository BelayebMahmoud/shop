services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ["5433:5432"]   # host 5433: a native Windows Postgres holds 5432
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro   # runs 001, 002 on first start only
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]   # TCP: the init-time server listens on the socket only
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
